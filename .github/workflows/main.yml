name: macOS_Final_Boss
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Ekran Paylaşımını Zorla Aç
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -access -on -clientopts -setvnclegacy -vnclegacy yes -clientopts -setvncpw -vncpw 123456 -restart -agent -privs -all
      
      - name: Cloudflared Kur ve Tünel Aç
        run: |
          brew install cloudflared
          # 5900 portunu (VNC) web üzerinden erişilebilir bir tünel haline getiriyoruz
          cloudflared tunnel --url tcp://localhost:5900
- name: Ekranı Zorla ve Sesi Aç
        run: |
          sudo killall WindowServer
          # Veya ekran uykusunu kapatmak için:
          sudo caffeinate -u -t 3600 &
- name: Ekranı Zorla ve Sesi Aç
        run: |
          sudo killall WindowServer
          # Veya ekran uykusunu kapatmak için:
          sudo caffeinate -u -t 3600 &
